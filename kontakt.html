<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Kontaktiraj Mariju za grafički ili web dizajn." />
    <title>Kontakt — Marija</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/script.js" defer></script>
  </head>
  <body data-page="contact">
    <header class="site-header">
      <a class="brand" href="/">MARIJA <span class="brand-mark" aria-hidden="true">◆</span></a>
      <a class="back-link" href="/" data-i18n="contact.back">← NAZAD NA POČETNU</a>
      <div class="language-switch" role="group" aria-label="Language">
        <button type="button" data-language="hr" aria-pressed="true">HR</button>
        <span>/</span>
        <button type="button" data-language="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <main class="contact-page">
      <p class="contact-number">05</p>
      <div class="contact-intro">
        <p class="eyebrow" data-i18n="contact.eyebrow">KONTAKT</p>
        <h1 data-i18n-html="contact.title">Hajde da napravimo<br />nešto vrijedno gledanja.</h1>
      </div>

      <div class="contact-details">
        <p data-i18n="contact.note">Za projekte, saradnje ili samo dobru ideju — piši.</p>
        <a class="contact-email" href="mailto:zdravo@marija.rs">zdravo@marija.rs ↗</a>
        <div class="contact-links">
          <a href="https://instagram.com/" target="_blank" rel="noreferrer">INSTAGRAM ↗</a>
          <a href="https://behance.net/" target="_blank" rel="noreferrer">BEHANCE ↗</a>
          <a href="https://github.com/mqrijqm" target="_blank" rel="noreferrer">GITHUB ↗</a>
        </div>
      </div>

      <footer class="contact-footer">
        <span data-i18n="contact.location">BANJA LUKA · DOSTUPNA GLOBALNO</span>
        <span>© <span data-current-year></span> MARIJA</span>
      </footer>
    </main>
    <div class="grain" aria-hidden="true"></div>
  </body>
</html>
